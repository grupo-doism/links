<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
  <script>
    const PROFILE = {
      title:      "2M — Instagram Central",
      name:       "GRUPO",
      nameBlue:   "DOIS",
      nameSuffix: "M",
      bio:        "Conta central do Grupo DOISM.<br>Conteúdo, novidades e muito mais.",
      footer:     "© 2026 Grupo DOISM",
      showLogo:   true,
      initials:   "2M",
      /* ── Personalização visual ─────────────────────────────
         avatar:   URL de uma foto de perfil (substitui o logo)
                   Ex: "https://seusite.com/foto.jpg"
                   Deixe null para usar o logo/iniciais

         bgImage:  URL de uma imagem de fundo
                   Ex: "https://seusite.com/bg.jpg"
                   Deixe null para o fundo padrão

         bgColor:  Cor sólida de fundo (substitui o preto padrão)
                   Ex: "#1a0a2e"  |  Deixe null para manter padrão
      ─────────────────────────────────────────────────────── */
      avatar:   null,
      bgImage:  null,
      bgColor:  null
    };

    const LINKS = [
      { id:"whatsapp",  label:"Fale no WhatsApp",    url:"https://wa.me/5511999999999",             icon:"💬", color:"#25d366" },
      { id:"site",      label:"Nosso Site",           url:"https://grupodoism.com.br",               icon:"🌐", color:"#29ABE2" },
      { id:"youtube",   label:"Canal no YouTube",     url:"https://youtube.com/@grupodoism",         icon:"▶️", color:"#ff3030" },
      { id:"linkedin",  label:"LinkedIn",             url:"https://linkedin.com/company/grupodoism", icon:"💼", color:"#0a66c2" },
      { id:"catalogo",  label:"Catálogo de Produtos", url:"https://grupodoism.com.br/catalogo",      icon:"📋", color:"#9b59f7" },
      { id:"contato",   label:"Entre em Contato",     url:"mailto:contato@grupodoism.com.br",        icon:"✉️", color:"#f7a24f" }
    ];

    const SOCIALS = [
      { label:"Instagram", url:"https://instagram.com/grupodoism",        icon:"instagram" },
      { label:"YouTube",   url:"https://youtube.com/@grupodoism",         icon:"youtube"   },
      { label:"LinkedIn",  url:"https://linkedin.com/company/grupodoism", icon:"linkedin"  },
      { label:"WhatsApp",  url:"https://wa.me/5511999999999",             icon:"whatsapp"  }
    ];
  </script>
  <style>
    :root { --bg:#111111; --surface:#1c1c1c; --border:rgba(255,255,255,.08); --fg:#f5f5f5; --muted:#808080; --accent:#29ABE2; --radius:14px; }
    @media (prefers-color-scheme:light) { :root { --bg:#f5f7fa; --surface:#fff; --border:rgba(0,0,0,.09); --fg:#111; --muted:#6b7280; --accent:#1a90c8; } }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:52px max(16px,env(safe-area-inset-left,0px)) 72px;position:relative;background-size:cover;background-position:center;background-attachment:fixed}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 35% at 50% 0%,rgba(41,171,226,.13) 0%,transparent 65%);pointer-events:none;z-index:0}
    body.has-bg::after{content:'';position:fixed;inset:0;background:rgba(0,0,0,.55);pointer-events:none;z-index:0}
    .page{position:relative;z-index:1;width:100%;max-width:460px}
    .profile{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:40px}
    .avatar-ring{position:relative;width:108px;height:108px;margin-bottom:20px}
    .avatar-ring::before{content:'';position:absolute;inset:-3px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#1178a8);z-index:0}
    .avatar-ring.round::before{border-radius:50%}
    .avatar-inner{position:relative;z-index:1;width:100%;height:100%;border-radius:12px;border:3px solid var(--bg);background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .avatar-ring.round .avatar-inner{border-radius:50%}
    .avatar-inner img{width:100%;height:100%;object-fit:cover}
    .initials{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:28px;letter-spacing:-1px;color:var(--accent)}
    .profile-name{font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:-.03em;margin-bottom:8px}
    .profile-bio{font-size:.88rem;color:var(--muted);line-height:1.65;max-width:320px}
    .section-label{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:12px;padding-left:2px}
    .links{display:flex;flex-direction:column;gap:9px;margin-bottom:28px}
    .link-btn{display:flex;align-items:center;gap:14px;min-height:58px;padding:10px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--fg);text-decoration:none;font-size:.93rem;font-weight:500;transition:transform .14s,border-color .14s,box-shadow .14s;position:relative;overflow:hidden}
    .link-btn::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);transform:translateX(-100%);transition:transform .45s}
    .link-btn:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.14);box-shadow:0 10px 28px rgba(0,0,0,.28)}
    .link-btn:hover::after{transform:translateX(100%)}
    .link-btn:active{transform:translateY(0)}
    .link-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
    .link-label{flex:1;min-width:0}
    .link-count{font-size:.68rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);background:rgba(128,128,128,.12);border-radius:20px;padding:2px 9px;white-space:nowrap}
    .link-arrow{color:var(--muted);font-size:13px;transition:transform .14s,color .14s;flex-shrink:0}
    .link-btn:hover .link-arrow{transform:translateX(3px);color:var(--fg)}
    .socials{display:flex;justify-content:center;gap:10px;margin-bottom:40px}
    .social-btn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;transition:transform .14s,color .14s,border-color .14s}
    .social-btn:hover{transform:translateY(-2px);color:var(--fg);border-color:rgba(255,255,255,.18)}
    footer{font-size:.72rem;color:var(--muted);text-align:center;opacity:.55}
  </style>
</head>
<body>
<main class="page">
  <section class="profile">
    <div class="avatar-ring" id="avatar-ring"><div class="avatar-inner" id="avatar-inner"></div></div>
    <h1 class="profile-name" id="profile-name"></h1>
    <p class="profile-bio" id="profile-bio"></p>
  </section>
  <p class="section-label">Acesse</p>
  <nav class="links" id="links-container"></nav>
  <div class="socials" id="socials-container"></div>
  <footer id="footer"></footer>
</main>
<script src="../_template/renderer.js"></script>
<script>render(PROFILE, LINKS, SOCIALS);</script>
</body>
</html>
