<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Grupo DOISM Links</title>
  <style>
    :root {
      --bg:#0d0d0d; --surface:#161616; --surface2:#1f1f1f;
      --border:rgba(255,255,255,.07); --fg:#f0f0f0; --muted:#707070;
      --accent:#29ABE2; --danger:#e05252; --success:#4ade80; --radius:10px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;font-size:14px;line-height:1.5}
    .screen{display:none} .screen.active{display:flex}

    /* ── Setup ── */
    #screen-setup{min-height:100vh;align-items:center;justify-content:center;flex-direction:column;padding:24px}
    .setup-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;width:100%;max-width:420px}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}
    .brand h1{font-size:1.3rem;font-weight:700;letter-spacing:-.02em} .brand span{color:var(--accent)}
    .brand small{display:block;font-size:.7rem;color:var(--muted);font-weight:400}

    /* ── App shell ── */
    #screen-app{flex-direction:row;min-height:100vh}

    /* ── Sidebar ── */
    .sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:100vh}
    .sb-logo{padding:18px 14px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-weight:700;font-size:.9rem}
    .sb-logo span{color:var(--accent)} .sb-logo small{font-size:.65rem;font-weight:400;color:var(--muted);display:block}
    .sb-sec{padding:12px 10px 4px;font-size:.64rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
    .prof-item{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:2px 8px;border-radius:8px;cursor:pointer;transition:background .12s;font-size:.86rem}
    .prof-item:hover{background:var(--surface2)} .prof-item.active{background:rgba(41,171,226,.12);color:var(--accent)}
    .prof-item .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
    .prof-item.active .dot{background:var(--accent)} .prof-item>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .copy-url-btn{opacity:0;width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:opacity .12s,color .12s;flex-shrink:0;padding:0;line-height:1}
    .prof-item:hover .copy-url-btn,.prof-item.active .copy-url-btn{opacity:1} .copy-url-btn:hover{color:var(--accent)}
    .sb-new{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:8px;border-radius:8px;cursor:pointer;font-size:.86rem;color:var(--accent);border:1px solid rgba(41,171,226,.25);background:rgba(41,171,226,.06);transition:background .12s}
    .sb-new:hover{background:rgba(41,171,226,.12)}
    .sb-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
    .sb-out{font-size:.76rem;color:var(--muted);cursor:pointer;padding:6px 8px;border-radius:6px;transition:color .12s} .sb-out:hover{color:var(--fg)}

    /* ── Main ── */
    .main{flex:1;overflow-y:auto;padding:32px;max-width:720px}
    .welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;color:var(--muted)}
    .welcome h2{font-size:1.1rem;color:var(--fg);margin-bottom:8px}

    /* ── Form ── */
    .fsec{margin-bottom:28px}
    .fsec h3{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
    .frow.full{grid-template-columns:1fr} .frow.three{grid-template-columns:1fr 1fr 1fr}
    label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:5px}
    input[type=text],input[type=url],textarea,select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 11px;color:var(--fg);font-size:.86rem;font-family:inherit;outline:none;transition:border-color .12s}
    input:focus,textarea:focus{border-color:var(--accent)} textarea{resize:vertical;min-height:68px}
    input[type=color]{padding:3px;height:36px;border-radius:8px;cursor:pointer;background:var(--surface2);border:1px solid var(--border)}

    /* ── Image field ── */
    .img-field{display:flex;gap:10px;align-items:flex-start}
    .img-prev{width:68px;height:68px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
    .img-prev img{width:100%;height:100%;object-fit:cover}
    .img-ctrl{flex:1}
    .upload-lbl{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--fg);font-size:.76rem;cursor:pointer;transition:border-color .12s;margin-top:6px}
    .upload-lbl:hover{border-color:var(--accent);color:var(--accent)}

    /* ── Links editor ── */
    .links-list{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
    .link-item{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:11px 12px}
    .link-item-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
    .link-item-body{padding-left:43px;display:flex;flex-direction:column;gap:7px}
    .link-item-meta{display:flex;gap:6px;align-items:center}
    .link-acts{display:flex;gap:4px;margin-left:auto;flex-shrink:0}
    .link-ic{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
    .ico-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:color .12s,border-color .12s;flex-shrink:0}
    .ico-btn:hover{color:var(--fg);border-color:rgba(255,255,255,.18)} .ico-btn:disabled{opacity:.3;cursor:default}
    .ico-btn.del:hover{color:var(--danger);border-color:var(--danger)}

    /* ── Socials ── */
    .soc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .soc-row{display:flex;align-items:center;gap:8px}
    .soc-ic{width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

    /* ── Buttons ── */
    .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:9px;font-size:.86rem;font-weight:600;cursor:pointer;transition:opacity .12s,transform .1s;border:none;font-family:inherit}
    .btn:active{transform:scale(.98)} .btn:disabled{opacity:.4;cursor:not-allowed}
    .btn-primary{background:var(--accent);color:#fff} .btn-primary:hover{opacity:.88}
    .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--fg)} .btn-ghost:hover{border-color:rgba(255,255,255,.2)}
    .btn-danger{background:rgba(224,82,82,.1);border:1px solid rgba(224,82,82,.22);color:var(--danger)} .btn-danger:hover{background:rgba(224,82,82,.18)}
    .actions{display:flex;align-items:center;gap:10px;padding-top:22px;border-top:1px solid var(--border);margin-top:22px}
    .actions .sp{flex:1}

    /* ── Toast ── */
    #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 20px;font-size:.86rem;transition:transform .3s;z-index:999;white-space:nowrap}
    #toast.show{transform:translateX(-50%) translateY(0)} #toast.success{border-color:var(--success);color:var(--success)} #toast.error{border-color:var(--danger);color:var(--danger)}

    /* ── Spinner ── */
    .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite} @keyframes sp{to{transform:rotate(360deg)}}

    /* ── Confirm overlay ── */
    #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
    #overlay.show{display:flex}
    .confirm{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:340px;text-align:center}
    .confirm h3{margin-bottom:8px} .confirm p{color:var(--muted);font-size:.86rem;margin-bottom:22px}
    .confirm-acts{display:flex;gap:10px;justify-content:center}

    /* ── Banner ── */
    .banner{background:rgba(41,171,226,.08);border:1px solid rgba(41,171,226,.2);border-radius:9px;padding:11px 14px;font-size:.82rem;color:var(--accent);margin-bottom:20px}

    @media(max-width:640px){.sidebar{display:none} .main{padding:16px} .frow,.frow.three{grid-template-columns:1fr} .link-item-body{padding-left:0}}
  </style>
</head>
<body>

<!-- ══ SETUP ══════════════════════════════════════════ -->
<div id="screen-setup" class="screen active">
  <div class="setup-card">
    <div class="brand">
      <svg viewBox="0 0 72 72" width="38" height="38" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="28" height="5" fill="#fff"/><rect x="6" y="6" width="5" height="28" fill="#fff"/>
        <rect x="6" y="29" width="20" height="5" fill="#fff"/><rect x="20" y="18" width="14" height="5" fill="#fff"/>
        <rect x="29" y="6" width="5" height="17" fill="#fff"/>
        <rect x="6" y="40" width="20" height="5" fill="#29ABE2"/><rect x="6" y="40" width="5" height="10" fill="#29ABE2"/>
        <rect x="6" y="50" width="20" height="5" fill="#29ABE2"/><rect x="21" y="55" width="5" height="11" fill="#29ABE2"/>
        <rect x="6" y="61" width="20" height="5" fill="#29ABE2"/>
        <rect x="38" y="40" width="5" height="26" fill="#fff"/><rect x="43" y="40" width="11" height="5" fill="#fff"/>
        <rect x="49" y="40" width="5" height="11" fill="#fff"/><rect x="54" y="40" width="12" height="5" fill="#fff"/>
        <rect x="61" y="40" width="5" height="26" fill="#fff"/>
      </svg>
      <div><h1>GRUPO<span>DOIS</span>M</h1><small>Admin — Gerenciador de Links</small></div>
    </div>
    <div style="margin-bottom:16px">
      <label>GitHub Personal Access Token</label>
      <input type="text" id="pat" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off"/>

</div>

<!-- ══ APP ════════════════════════════════════════════ -->
<div id="screen-app" class="screen">
  <aside class="sidebar">
    <div class="sb-logo">
      <svg viewBox="0 0 72 72" width="26" height="26" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="6" width="28" height="5" fill="#fff"/><rect x="6" y="6" width="5" height="28" fill="#fff"/>
        <rect x="6" y="29" width="20" height="5" fill="#fff"/><rect x="20" y="18" width="14" height="5" fill="#fff"/>
        <rect x="29" y="6" width="5" height="17" fill="#fff"/>
        <rect x="6" y="40" width="20" height="5" fill="#29ABE2"/><rect x="6" y="40" width="5" height="10" fill="#29ABE2"/>
        <rect x="6" y="50" width="20" height="5" fill="#29ABE2"/><rect x="21" y="55" width="5" height="11" fill="#29ABE2"/>
        <rect x="6" y="61" width="20" height="5" fill="#29ABE2"/>
        <rect x="38" y="40" width="5" height="26" fill="#fff"/><rect x="43" y="40" width="11" height="5" fill="#fff"/>
        <rect x="49" y="40" width="5" height="11" fill="#fff"/><rect x="54" y="40" width="12" height="5" fill="#fff"/>
        <rect x="61" y="40" width="5" height="26" fill="#fff"/>
      </svg>
      <div><div>GRUPO<span>DOIS</span>M</div><small>Admin Links</small></div>
    </div>
    <div style="padding:8px"><div class="sb-new" onclick="newProfile()"><span>+</span> Novo Perfil</div></div>
    <div class="sb-sec">Perfis</div>
    <div id="prof-list"></div>
    <div class="sb-foot"><div class="sb-out" onclick="logout()">↩ Sair</div></div>
  </aside>

  <div class="main">
    <div id="v-welcome" class="welcome">
      <div style="font-size:48px;margin-bottom:16px">🔗</div>
      <h2>Gerenciador de Links</h2>
      <p>Selecione um perfil ou crie um novo.</p>
    </div>
    <div id="v-editor" style="display:none"></div>
  </div>
</div>

<!-- ══ CONFIRM ════════════════════════════════════════ -->
<div id="overlay">
  <div class="confirm">
    <h3>Excluir perfil?</h3>
    <p id="confirm-msg"></p>
    <div class="confirm-acts">
      <button class="btn btn-ghost" onclick="closeConfirm()">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok" onclick="confirmDelete()">Excluir</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════
// CONSTANTES
// ═══════════════════════════════════════
const OWNER   = 'grupo-doism';
const REPO    = 'links';
const SITE    = 'https://grupodoism-links.vercel.app';
const API     = `https://api.github.com/repos/${OWNER}/${REPO}`;
const RESERVED = new Set(['admin','_template','assets','.git','.github','node_modules']);

// ═══════════════════════════════════════
// ESTADO
// ═══════════════════════════════════════
let token = '';
let profiles = [];
let activeProfile = null;
let editLinks = [];
let deleteTarget = null;

// ═══════════════════════════════════════
// GITHUB API
// ═══════════════════════════════════════
function hdrs() {
  return { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' };
}
async function ghGet(path) {
  const r = await fetch(API + path, { headers: hdrs() });
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}
async function ghFile(path) {
  try { const r = await fetch(`${API}/contents/${path}`, { headers: hdrs() }); return r.ok ? r.json() : null; } catch { return null; }
}
async function ghPut(path, content, sha, msg) {
  const body = { message: msg, content: btoa(unescape(encodeURIComponent(content))) };
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/contents/${path}`, { method:'PUT', headers: hdrs(), body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.message || 'Erro GitHub');
  return d;
}
async function ghDel(path, sha, msg) {
  const r = await fetch(`${API}/contents/${path}`, { method:'DELETE', headers: hdrs(), body: JSON.stringify({ message: msg, sha }) });
  if (!r.ok) { const d = await r.json(); throw new Error(d.message || 'Erro GitHub'); }
}
function decode(f) { return decodeURIComponent(escape(atob(f.content.replace(/\n/g,'')))); }

// ═══════════════════════════════════════
// AUTH
// ═══════════════════════════════════════
async function connect() {
  token = document.getElementById('pat').value.trim();
  if (!token) { toast('Informe o token','error'); return; }
  try {
    toast('Conectando…');
    await ghGet('/contents/');
    localStorage.setItem('gh_token', token);
    showApp();
  } catch { toast('Token inválido ou sem acesso ao repositório','error'); }
}
function logout() {
  localStorage.removeItem('gh_token');
  token = ''; profiles = []; activeProfile = null;
  document.getElementById('screen-app').classList.remove('active');
  document.getElementById('screen-setup').classList.add('active');
  document.getElementById('pat').value = '';
}

// ═══════════════════════════════════════
// CARREGAR PERFIS
// ═══════════════════════════════════════
async function showApp() {
  document.getElementById('screen-setup').classList.remove('active');
  document.getElementById('screen-app').classList.add('active');
  await loadProfiles();
}
async function loadProfiles() {
  document.getElementById('prof-list').innerHTML = '<div style="padding:10px 16px;color:var(--muted);font-size:.8rem">Carregando…</div>';
  const contents = await ghGet('/contents/');
  profiles = [{ name:'root', label:'Principal', url: SITE }];
  for (const item of contents) {
    if (item.type === 'dir' && !RESERVED.has(item.name) && !item.name.startsWith('_') && !item.name.startsWith('.'))
      profiles.push({ name: item.name, label: item.name, url: `${SITE}/${item.name}` });
  }
  renderSidebar();
}
function renderSidebar() {
  document.getElementById('prof-list').innerHTML = profiles.map(p => `
    <div class="prof-item ${activeProfile?.name===p.name?'active':''}" onclick="openProfile('${p.name}')">
      <div class="dot"></div><span>${p.label}</span>
      <button class="copy-url-btn" onclick="event.stopPropagation();copyUrl('${p.url}')" title="Copiar link">⎘</button>
    </div>`).join('');
}

// ═══════════════════════════════════════
// ABRIR / NOVO PERFIL
// ═══════════════════════════════════════
async function openProfile(name) {
  activeProfile = { name };
  renderSidebar();
  const ed = document.getElementById('v-editor');
  ed.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)"><div class="spin" style="margin:0 auto 12px"></div><p>Carregando…</p></div>';
  document.getElementById('v-welcome').style.display = 'none';
  ed.style.display = 'block';

  const isRoot = name === 'root';
  const cfgPath = isRoot ? '_config.json' : `${name}/_config.json`;
  const cfgFile = await ghFile(cfgPath);

  let cfg, isImported = false;
  if (cfgFile) {
    cfg = JSON.parse(decode(cfgFile));
  } else {
    isImported = true;
    cfg = {
      profile: { title: isRoot?'Grupo DOISM — Links':'Novo Perfil', name:'GRUPO', nameBlue:'DOIS', nameSuffix:'M',
        bio:'', footer:'© 2026 Grupo DOISM', showLogo:true, initials:'GD', avatar:null, bgImage:null, bgColor:null },
      links: [], socials: []
    };
  }

  activeProfile = { name, cfg };
  editLinks = JSON.parse(JSON.stringify(cfg.links || []));
  renderEditor(isRoot, cfg, false, isImported);
}

function newProfile() {
  activeProfile = { name:'__new__', cfg: null };
  renderSidebar();
  editLinks = [{ id:'whatsapp', label:'Fale no WhatsApp', url:'https://wa.me/55', icon:'💬', color:'#25d366' }];
  document.getElementById('v-welcome').style.display = 'none';
  document.getElementById('v-editor').style.display = 'block';
  renderEditor(false, {
    profile: { title:'Novo Perfil', name:'GRUPO', nameBlue:'DOIS', nameSuffix:'M', bio:'',
      footer:'© 2026 Grupo DOISM', showLogo:true, initials:'GD', avatar:null, bgImage:null, bgColor:null },
    links:[], socials:[]
  }, true);
}

// ═══════════════════════════════════════
// RENDERIZAR EDITOR
// ═══════════════════════════════════════
function renderEditor(isRoot, cfg, isNew=false, isImported=false) {
  const p = cfg.profile;
  const soc = { instagram:'', youtube:'', linkedin:'', whatsapp:'', tiktok:'', facebook:'' };
  for (const s of (cfg.socials||[])) if (s.icon in soc) soc[s.icon] = s.url;

  const folderBlock = (!isRoot && isNew) ? `
    <div class="fsec"><h3>Identificação</h3>
      <div class="frow"><div>
        <label>Nome da pasta (vira a URL)</label>
        <input type="text" id="f-folder" placeholder="ex: vendas, cracha-artur"/>
        <p style="font-size:.71rem;color:var(--muted);margin-top:4px">${SITE}/<strong id="folder-prev">…</strong></p>
      </div></div>
    </div>` : '';

  document.getElementById('v-editor').innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:26px">
      <div>
        <h2 style="font-size:1.05rem;font-weight:700">${isNew?'Novo Perfil':isRoot?'Perfil Principal':activeProfile.name}</h2>
        ${!isNew?`<a href="${isRoot?SITE:SITE+'/'+activeProfile.name}" target="_blank"
          style="font-size:.76rem;color:var(--accent);text-decoration:none">↗ Ver ao vivo</a>`:''}
      </div>
      ${!isNew&&!isRoot?`<button class="btn btn-danger" style="margin-left:auto" onclick="askDelete('${activeProfile.name}')">Excluir</button>`:''}
    </div>
    ${isImported?`<div class="banner">⚠ Perfil criado manualmente — salve para habilitar edição completa pelo admin.</div>`:''}
    ${folderBlock}
    <div class="fsec"><h3>Identidade</h3>
      <div class="frow"><div>
        <label>Título da aba do browser</label>
        <input type="text" id="f-title" value="${esc(p.title)}"/>
      </div></div>
      <div class="frow three">
        <div><label>Nome (branco)</label><input type="text" id="f-name" value="${esc(p.name)}" placeholder="GRUPO"/></div>
        <div><label>Nome (azul)</label><input type="text" id="f-blue" value="${esc(p.nameBlue)}" placeholder="DOIS"/></div>
        <div><label>Sufixo</label><input type="text" id="f-suffix" value="${esc(p.nameSuffix)}" placeholder="M"/></div>
      </div>
      <div class="frow full"><div>
        <label>Bio (use &lt;br&gt; para quebrar linha)</label>
        <textarea id="f-bio">${esc(p.bio||'')}</textarea>
      </div></div>
      <div class="frow full"><div>
        <label>Rodapé</label><input type="text" id="f-footer" value="${esc(p.footer||'© 2026 Grupo DOISM')}"/>

// ═══════════════════════════════════════
// LINKS
// ═══════════════════════════════════════
function renderLinks() {
  const c = document.getElementById('links-ed');
  if (!c) return;
  if (!editLinks.length) { c.innerHTML = '<p style="color:var(--muted);font-size:.8rem;margin-bottom:10px">Nenhum link ainda.</p>'; return; }
  c.innerHTML = `<div class="links-list">${editLinks.map((l,i)=>`
    <div class="link-item" data-idx="${i}">
      <div class="link-item-head">
        <div class="link-ic" style="background:${l.color}1a;color:${l.color}">${l.icon}</div>
        <input type="text" data-f="label" value="${esc(l.label)}" placeholder="Nome do botão" style="flex:1"/>
        <div class="link-acts">
          <button class="ico-btn" onclick="moveLink(${i},-1)" ${i===0?'disabled':''} title="Subir">↑</button>
          <button class="ico-btn" onclick="moveLink(${i},1)" ${i===editLinks.length-1?'disabled':''} title="Descer">↓</button>
          <button class="ico-btn del" onclick="removeLink(${i})" title="Remover">🗑</button>
        </div>
      </div>
      <div class="link-item-body">
        <input type="url" data-f="url" value="${esc(l.url)}" placeholder="https://"/>
        <div class="link-item-meta">
          <input type="text" data-f="icon" value="${esc(l.icon)}" placeholder="💬" style="width:50px;text-align:center" oninput="syncLink(${i},this);renderLinks()"/>
          <input type="color" data-f="color" value="${l.color}" style="width:40px;height:32px;padding:2px" oninput="syncLink(${i},this);renderLinks()"/>
          <input type="text" data-f="id" value="${esc(l.id)}" placeholder="id-unico" style="flex:1;font-size:.72rem;opacity:.6"/>
        </div>
      </div>
    </div>`).join('')}
  </div>`;
}
function syncLink(idx, inp) { if (editLinks[idx]) editLinks[idx][inp.dataset.f] = inp.value; }
function addLink() { editLinks.push({ id:'link-'+Date.now(), label:'Novo Link', url:'https://', icon:'🔗', color:'#29ABE2' }); renderLinks(); }
function removeLink(i) { collectLinks(); editLinks.splice(i,1); renderLinks(); }
function moveLink(i,d) { collectLinks(); const j=i+d; if(j<0||j>=editLinks.length)return; [editLinks[i],editLinks[j]]=[editLinks[j],editLinks[i]]; renderLinks(); }
function collectLinks() {
  document.querySelectorAll('.link-item').forEach(item => {
    const idx = parseInt(item.dataset.idx);
    if (!editLinks[idx]) return;
    item.querySelectorAll('[data-f]').forEach(inp => { editLinks[idx][inp.dataset.f] = inp.value; });
  });
}

// ═══════════════════════════════════════
// IMAGENS
// ═══════════════════════════════════════
async function uploadImg(input, fieldId, prevId) {
  const file = input.files[0]; if (!file) return;
  toast('Enviando imagem…');
  try {
    const name = (activeProfile?.name==='root'||activeProfile?.name==='__new__') ? 'geral' : activeProfile.name;
    const ext = file.name.split('.').pop().toLowerCase();
    const fname = `${name}-${Date.now()}.${ext}`;
    const url = await doUpload(file, `assets/images/${fname}`);
    document.getElementById(fieldId).value = url;
    setImgPrev(prevId, url);
    toast('Imagem enviada!','success');
  } catch(e) { toast('Erro: '+e.message,'error'); }
}
function doUpload(file, path) {
  if (file.size > 900000) return Promise.reject(new Error('Imagem muito grande (máx 900 KB). Comprima antes de enviar.'));
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = async e => {
      try {
        const b64 = e.target.result.split(',')[1];
        if (!b64) throw new Error('Falha ao ler o arquivo');
        const resp = await fetch(`${API}/contents/${path}`, { method:'PUT', headers: hdrs(),
          body: JSON.stringify({ message:`Upload ${path}`, content: b64 }) });
        const d = await resp.json().catch(()=>({}));
        if (!resp.ok) throw new Error(d.message || `HTTP ${resp.status} — verifique permissão do token`);
        res(`${SITE}/${path}`);
      } catch(err) { rej(err); }
    };
    r.onerror = () => rej(new Error('Falha ao ler o arquivo')); r.readAsDataURL(file);
  });
}
function setImgPrev(id, url) {
  const el = document.getElementById(id); if (!el) return;
  el.innerHTML = url ? `<img src="${url}" onerror="this.parentElement.innerHTML='❌'"/>` : (id.includes('av')?'📷':'🖼');
}
function clearBgColor() { document.getElementById('f-bgc-pick').value='#111111'; document.getElementById('f-bgc-txt').value=''; }

// ═══════════════════════════════════════
// PUBLICAR
// ═══════════════════════════════════════
async function publish() {
  const btn = document.getElementById('pub-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Publicando…';
  try {
    collectLinks();
    const isNew  = activeProfile.name === '__new__';
    const isRoot = activeProfile.name === 'root';
    let folder = isRoot ? 'root' : (isNew ? document.getElementById('f-folder').value.trim() : activeProfile.name);

    if (isNew) {
      if (!folder) { toast('Informe o nome da pasta','error'); btn.disabled=false; btn.innerHTML='🚀 Criar Perfil'; return; }
      if (!/^[a-z0-9-]+$/.test(folder)) { toast('Use só letras minúsculas, números e hífens','error'); btn.disabled=false; btn.innerHTML='🚀 Criar Perfil'; return; }
      if (RESERVED.has(folder)) { toast('Nome reservado, escolha outro','error'); btn.disabled=false; btn.innerHTML='🚀 Criar Perfil'; return; }
    }

    const socials = [];
    document.querySelectorAll('.soc-inp').forEach(inp => {
      if (inp.value.trim()) socials.push({ label: inp.dataset.soc, url: inp.value.trim(), icon: inp.dataset.soc });
    });

    const bgcTxt = document.getElementById('f-bgc-txt')?.value.trim();
    const cfg = {
      profile: {
        title:      document.getElementById('f-title').value,
        name:       document.getElementById('f-name').value,
        nameBlue:   document.getElementById('f-blue').value,
        nameSuffix: document.getElementById('f-suffix').value,
        bio:        document.getElementById('f-bio').value,
        footer:     document.getElementById('f-footer').value,
        showLogo: true, initials: 'GD',
        avatar:  document.getElementById('f-avatar').value.trim() || null,
        bgImage: document.getElementById('f-bg').value.trim() || null,
        bgColor: bgcTxt || null
      },
      links: editLinks,
      socials
    };

    await saveProfile(folder, cfg, isRoot);
    toast('Publicado! Deploy em ~30s','success');
    activeProfile = { name: folder, cfg };
    btn.disabled = false; btn.innerHTML = '✓ Publicar';
    await loadProfiles();
  } catch(e) {
    toast('Erro: '+e.message,'error');
    btn.disabled=false; btn.innerHTML='✓ Publicar';
  }
}

async function saveProfile(folder, cfg, isRoot) {
  const cfgPath = isRoot ? '_config.json' : `${folder}/_config.json`;
  const htmPath = isRoot ? 'index.html'   : `${folder}/index.html`;
  const exCfg = await ghFile(cfgPath);
  await ghPut(cfgPath, JSON.stringify(cfg,null,2), exCfg?.sha, `Update ${folder} config via admin`);
  const html = genHTML(cfg, isRoot);
  const exHtm = await ghFile(htmPath);
  await ghPut(htmPath, html, exHtm?.sha, `Update ${folder} links page via admin`);
}

// ═══════════════════════════════════════
// EXCLUIR
// ═══════════════════════════════════════
function askDelete(name) {
  deleteTarget = name;
  document.getElementById('confirm-msg').textContent = `Excluir o perfil "${name}"? Esta ação não pode ser desfeita.`;
  document.getElementById('overlay').classList.add('show');
}
function closeConfirm() { document.getElementById('overlay').classList.remove('show'); deleteTarget=null; }
async function confirmDelete() {
  if (!deleteTarget) return;
  const btn = document.getElementById('confirm-ok');
  btn.disabled=true; btn.textContent='Excluindo…';
  try {
    const contents = await ghGet(`/contents/${deleteTarget}`);
    for (const f of contents) if (f.type==='file') await ghDel(f.path, f.sha, `Delete ${deleteTarget}`);
    closeConfirm(); toast('Perfil excluído!','success');
    activeProfile=null;
    document.getElementById('v-editor').style.display='none';
    document.getElementById('v-welcome').style.display='flex';
    await loadProfiles();
  } catch(e) { toast('Erro: '+e.message,'error'); }
  finally { btn.disabled=false; btn.textContent='Excluir'; }
}

function previewProf() {
  if (!activeProfile||activeProfile.name==='__new__') return;
  window.open(activeProfile.name==='root'?SITE:`${SITE}/${activeProfile.name}`,'_blank');
}

async function copyUrl(url) {
  try { await navigator.clipboard.writeText(url); toast('Link copiado!','success'); }
  catch { prompt('Copie o link:',url); }
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
let _tt;
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = type ? `show ${type}` : 'show';
  clearTimeout(_tt); _tt = setTimeout(()=>el.classList.remove('show'), 3200);
}
