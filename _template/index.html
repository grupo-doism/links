<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>

  <!-- ================================================================
       ✏️  EDITE ESTA SEÇÃO para criar um novo perfil
       ================================================================ -->
  <script>
    const PROFILE = {
      title:         "Grupo DOISM Links",   /* <title> da aba */
      name:          "GRUPO",               /* Primeira parte do nome */
      nameBlue:      "DOIS",                /* Parte em azul */
      nameSuffix:    "M",                   /* Sufixo após a parte azul */
      bio:           "Transformando ideias em resultados.<br>Soluções inteligentes para o seu negócio.",
      footer:        "© 2026 Grupo DOISM",
      showLogo:      true                   /* true = mostra logo G2M | false = mostra initials */,
      initials:      "GD"                   /* Usado só se showLogo: false */
    };

    const LINKS = [
      { id:"whatsapp",  label:"Fale no WhatsApp",    url:"https://wa.me/5511999999999",             icon:"💬", color:"#25d366" },
      { id:"site",      label:"Nosso Site",           url:"https://grupodoism.com.br",               icon:"🌐", color:"#29ABE2" },
      { id:"instagram", label:"Instagram",            url:"https://instagram.com/grupodoism",        icon:"📸", color:"#e1306c" },
      { id:"youtube",   label:"Canal no YouTube",     url:"https://youtube.com/@grupodoism",         icon:"▶️", color:"#ff3030" },
      { id:"linkedin",  label:"LinkedIn",             url:"https://linkedin.com/company/grupodoism", icon:"💼", color:"#0a66c2" },
      { id:"catalogo",  label:"Catálogo de Produtos", url:"https://grupodoism.com.br/catalogo",      icon:"📋", color:"#9b59f7" },
      { id:"contato",   label:"Entre em Contato",     url:"mailto:contato@grupodoism.com.br",        icon:"✉️", color:"#f7a24f" }
    ];

    const SOCIALS = [
      { label:"Instagram", url:"https://instagram.com/grupodoism",        icon:"instagram" },
      { label:"YouTube",   url:"https://youtube.com/@grupodoism",         icon:"youtube"   },
      { label:"LinkedIn",  url:"https://linkedin.com/company/grupodoism", icon:"linkedin"  },
      { label:"WhatsApp",  url:"https://wa.me/5511999999999",             icon:"whatsapp"  }
    ];
  </script>
  <!-- ================================================================ -->

  <style>
    /* Brand: Black + #29ABE2 */
    :root {
      --bg:      #111111;
      --surface: #1c1c1c;
      --border:  rgba(255,255,255,.08);
      --fg:      #f5f5f5;
      --muted:   #808080;
      --accent:  #29ABE2;
      --radius:  14px;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f5f7fa; --surface:#fff; --border:rgba(0,0,0,.09); --fg:#111; --muted:#6b7280; --accent:#1a90c8; }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px max(16px, env(safe-area-inset-left,0px)) 72px;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 35% at 50% 0%, rgba(41,171,226,.13) 0%, transparent 65%);
      pointer-events: none;
    }
    .page { position: relative; z-index: 1; width: 100%; max-width: 460px; }

    /* Profile */
    .profile { display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:40px; }
    .avatar-ring { position:relative; width:108px; height:108px; margin-bottom:20px; }
    .avatar-ring::before {
      content:''; position:absolute; inset:-3px; border-radius:14px;
      background:linear-gradient(135deg,var(--accent),#1178a8); z-index:0;
    }
    .avatar-inner {
      position:relative; z-index:1; width:100%; height:100%; border-radius:12px;
      border:3px solid var(--bg); background:#111; display:flex;
      align-items:center; justify-content:center; overflow:hidden;
    }
    .initials {
      font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px;
      letter-spacing:-1px; color:var(--accent);
    }
    .profile-name { font-family:'Space Grotesk',sans-serif; font-size:1.6rem; font-weight:700; letter-spacing:-.03em; margin-bottom:8px; }
    .profile-bio  { font-size:.88rem; color:var(--muted); line-height:1.65; max-width:320px; }

    /* Section label */
    .section-label { font-size:.68rem; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); margin-bottom:12px; padding-left:2px; }

    /* Link buttons */
    .links { display:flex; flex-direction:column; gap:9px; margin-bottom:28px; }
    .link-btn {
      display:flex; align-items:center; gap:14px; min-height:58px; padding:10px 18px;
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      color:var(--fg); text-decoration:none; font-size:.93rem; font-weight:500;
      transition:transform .14s,border-color .14s,box-shadow .14s; position:relative; overflow:hidden;
    }
    .link-btn::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.04),transparent);
      transform:translateX(-100%); transition:transform .45s;
    }
    .link-btn:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.14); box-shadow:0 10px 28px rgba(0,0,0,.28); }
    .link-btn:hover::after { transform:translateX(100%); }
    .link-btn:active { transform:translateY(0); }
    .link-icon { width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0; }
    .link-label { flex:1; min-width:0; }
    .link-count { font-size:.68rem; font-weight:600; font-variant-numeric:tabular-nums; color:var(--muted); background:rgba(128,128,128,.12); border-radius:20px; padding:2px 9px; white-space:nowrap; }
    .link-arrow  { color:var(--muted); font-size:13px; transition:transform .14s,color .14s; flex-shrink:0; }
    .link-btn:hover .link-arrow { transform:translateX(3px); color:var(--fg); }

    /* Socials */
    .socials { display:flex; justify-content:center; gap:10px; margin-bottom:40px; }
    .social-btn {
      width:44px; height:44px; border-radius:50%; background:var(--surface);
      border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
      color:var(--muted); text-decoration:none; transition:transform .14s,color .14s,border-color .14s;
    }
    .social-btn:hover { transform:translateY(-2px); color:var(--fg); border-color:rgba(255,255,255,.18); }

    footer { font-size:.72rem; color:var(--muted); text-align:center; opacity:.55; }
  </style>
</head>
<body>
<main class="page">

  <section class="profile">
    <div class="avatar-ring"><div class="avatar-inner" id="avatar-inner"></div></div>
    <h1 class="profile-name" id="profile-name"></h1>
    <p class="profile-bio" id="profile-bio"></p>
  </section>

  <p class="section-label">Acesse</p>
  <nav class="links" id="links-container"></nav>
  <div class="socials" id="socials-container"></div>
  <footer id="footer"></footer>

</main>
<script>
  /* ── SVG icons ── */
  const ICONS = {
    instagram: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>',
    youtube:   '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46A2.78 2.78 0 0 0 1.46 6.42 29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.96A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>',
    linkedin:  '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4V9h4v2a6 6 0 0 1 2-2z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>',
    whatsapp:  '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
    tiktok:    '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/></svg>',
    facebook:  '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>'
  };

  /* ── Logo SVG G2M ── */
  const LOGO_SVG = '<svg viewBox="0 0 72 72" width="68" height="68" xmlns="http://www.w3.org/2000/svg" aria-label="Grupo DOISM"><rect x="6" y="6" width="28" height="5" fill="#fff"/><rect x="6" y="6" width="5" height="28" fill="#fff"/><rect x="6" y="29" width="20" height="5" fill="#fff"/><rect x="20" y="18" width="14" height="5" fill="#fff"/><rect x="29" y="6" width="5" height="17" fill="#fff"/><rect x="6" y="40" width="20" height="5" fill="#29ABE2"/><rect x="6" y="40" width="5" height="10" fill="#29ABE2"/><rect x="6" y="50" width="20" height="5" fill="#29ABE2"/><rect x="21" y="55" width="5" height="11" fill="#29ABE2"/><rect x="6" y="61" width="20" height="5" fill="#29ABE2"/><rect x="38" y="40" width="5" height="26" fill="#fff"/><rect x="43" y="40" width="11" height="5" fill="#fff"/><rect x="49" y="40" width="5" height="11" fill="#fff"/><rect x="54" y="40" width="12" height="5" fill="#fff"/><rect x="61" y="40" width="5" height="26" fill="#fff"/></svg>';

  /* ── Render profile ── */
  document.title = PROFILE.title;
  document.getElementById('avatar-inner').innerHTML = PROFILE.showLogo
    ? LOGO_SVG
    : '<span class="initials">'+PROFILE.initials+'</span>';
  document.getElementById('profile-name').innerHTML =
    PROFILE.name + ' <span style="color:var(--accent)">' + PROFILE.nameBlue + '</span>' + PROFILE.nameSuffix;
  document.getElementById('profile-bio').innerHTML  = PROFILE.bio;
  document.getElementById('footer').textContent     = PROFILE.footer;

  /* ── Render links ── */
  function getCount(id) { try { return parseInt(localStorage.getItem('click_'+id)||'0'); } catch { return 0; } }
  function incCount(id) { try { localStorage.setItem('click_'+id, getCount(id)+1); } catch {} }

  const linksEl = document.getElementById('links-container');
  LINKS.forEach(function(item) {
    var count = getCount(item.id);
    var a = document.createElement('a');
    a.href = item.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.className = 'link-btn';
    a.innerHTML =
      '<span class="link-icon" style="background:'+item.color+'1a;color:'+item.color+'">'+item.icon+'</span>'+
      '<span class="link-label">'+item.label+'</span>'+
      (count > 0 ? '<span class="link-count" id="cnt-'+item.id+'">'+count+'</span>' : '<span class="link-count" id="cnt-'+item.id+'" style="display:none">0</span>')+
      '<span class="link-arrow">→</span>';
    a.addEventListener('click', function() {
      incCount(item.id);
      var b = document.getElementById('cnt-'+item.id);
      if (b) { b.style.display=''; b.textContent = getCount(item.id); }
    });
    linksEl.appendChild(a);
  });

  /* ── Render socials ── */
  var socialsEl = document.getElementById('socials-container');
  SOCIALS.forEach(function(item) {
    var a = document.createElement('a');
    a.href = item.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.className = 'social-btn'; a.title = item.label;
    a.innerHTML = typeof item.icon === 'string' && ICONS[item.icon] ? ICONS[item.icon] : item.icon;
    socialsEl.appendChild(a);
  });
</script>
</body>
</html>
